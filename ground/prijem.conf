ZADOST_KF=1
# MERENI=0  ukladat zmensene snimky do mereni-kf/ (projevi se pri dalsim otevreni okna)
MERENI=0
PAUZA=0
# OKNO=wayland  obraz primo pres Wayland (nizsi zpozdeni); x11 = puvodni okno pres XWayland (pri dalsim otevreni okna)
OKNO=wayland
# CELA_OBRAZOVKA=1  pres celou obrazovku (meni se za behu); okno je bez ramecku - zavrit Ctrl+C v terminalu s videem
CELA_OBRAZOVKA=1
