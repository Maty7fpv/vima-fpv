# Vima - nastaveni vysilace wfb-ng na desce
# Po zmene: /etc/init.d/S98vimawfb restart

# 1 = po startu desky automaticky spustit vysilani
WFB_ENABLE=1

# Rozhrani karty (ovladac se nacita s ifname=wfb%d)
WFB_IF=wfb0
WFB_CHANNEL=13
WFB_BW=HT20
# Vykon: index 1-63 (0 = tovarni neomezeny vykon, zakazano), 1 krok = asi 0,5 dB (zmereno 25. 10.).
# Volba podle pasma; vima-wfb i vima-ctl.py vzdy omezi na 2,4 GHz max 50, 5,8 GHz max 20.
# 2,4 GHz: idx 50 = odhad ~8 mW EIRP, nejhure ~80 mW (limit 100 mW); 5,8 GHz: idx 20 (limit 25 mW). Anteny 3 dBi.
# Odhad z RSSI na 2 m, nejistota +-10 dB -> nastaveno s rezervou 10 dB pod limitem.
WFB_TXPWR_IDX=10
WFB_TXPWR_IDX_2G=50
WFB_TXPWR_IDX_5G=20
WFB_MCS=1
# STBC a LDPC: 25. 10. doma STBC zhorsil prijem (o 18 % mene paketu), LDPC neprukazne -> vypnuto
WFB_STBC=0
WFB_LDPC=0
WFB_FEC_K=4
WFB_FEC_N=8
WFB_FEC_TIMEOUT=1
WFB_RADIO_PORT=0
# Na tento UDP port se posilaji data k odvysilani
WFB_UDP_PORT=5602
WFB_KEY=/etc/vima/drone.key

# Regulacni domena (CZ: 5725-5875 MHz bez NO-IR, limit 25 mW; 2,4 GHz limit 100 mW)
REGDOM=CZ

# Video z kamery (RTSP z rkipc -> RTP primo na UDP port wfb_tx): 1 = zapnuto
VIDEO_ENABLE=1
VIDEO_URL=rtsp://127.0.0.1:554/live/0

# Testovaci data misto videa (jen kdyz VIDEO_ENABLE=0): 1 = zapnuto
TESTGEN_ENABLE=0
TESTGEN_KBPS=2000

# Pevna adresa na eth0 pro SSH z laptopu (navic k DHCP)
ETH_STATIC=10.42.0.2/24

# Obousmerny IP tunel vzduchem (wfb_tun + wfb_tx/wfb_rx na stejne karte jako video)
# deska 10.5.0.2 <-> laptop 10.5.0.1; radiove porty jako wfb-ng: deska->laptop 32 (0x20), laptop->deska 160 (0xa0)
TUN_ENABLE=1
TUN_IF=wfb-tun
TUN_ADDR=10.5.0.2/24
TUN_TX_PORT=32
TUN_RX_PORT=160
# FEC tunelu: kazdy paket 2x (k=1, n=2), bez cekani
TUN_FEC_K=1
TUN_FEC_N=2
# wfb_tun: spojovani paketu do jednoho ramce (ms); 0 = posilat hned (nejnizsi odezva)
TUN_AGG_MS=5
# Strop datoveho toku tunelu z desky (kbit/s, 0 = bez omezeni). Velky prenos (scp 1 MB, 1,5 Mbit/s)
# 25. 10. zabral vzduch videu (141 ztracenych paketu videa za 30 s); 300 kbit/s staci na prikazy a SSH.
TUN_RATE_KBIT=300

# Ovladani ze zeme (vima-ctl.py, UDP 5900 pres tunel): datovy tok, fps, rozliseni, vykon, kanal.
# Zmeny videa a vykonu plati do restartu; prepnuty kanal se po potvrzeni zapise sem (WFB_CHANNEL).
CTL_ENABLE=1
# pevne ridici porty wfb_tx (127.0.0.1) pro zmenu MCS/FEC za behu
WFB_CTRL_PORT=8000
TUN_CTRL_PORT=8001
# Plynuly obraz (krok 3): dlouhy GOP + klicovy snimek na zadost prijimace (prijem.py).
# Dlouhy GOP jen kdyz se prijimac ozyva (rx_alive), jinak GOP = fps. 0 = vypnuto (GOP = fps).
VIDEO_SMOOTH=1
# Adaptivni spoj (krok 4): MCS videa a tok podle kvality prijmu, kterou hlasi laptop (prijem.py).
# Bez hlaseni 1,5 s -> nejodolnejsi profil MCS 0. 0 = pevne WFB_MCS a tok.
ALINK=1
